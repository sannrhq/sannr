name: Release package

# Preparation only. The owner reviews the draft's exact artifact hash before
# publishing the release or dispatching npm publication.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare as a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gates:
    name: Package gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify version equals tag
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*))?(?:\+[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*)?$/.exec(version);
          if (!match || match[4]?.split(".").some(part => /^0[0-9]+$/.test(part))
            || process.env.RELEASE_TAG !== `v${version}`) {
            console.error("Requested tag does not match package version");
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${Boolean(match[4])}\n`);
          NODE
      - name: Unit tests (skips listed by name, never hidden)
        shell: bash
        run: |
          npm run test:full 2>&1 | tee unit.log
          {
            echo "### Unit tests — Node ${{ matrix.node }}"
            grep -E '^(ℹ|#) (tests|pass|fail|skipped)' unit.log | sed -E 's/^(ℹ|#) /- /'
            echo
            echo "Skipped on this runner (a skip is a claim this run did not check):"
            grep -E '^﹣|# SKIP' unit.log | sed -E 's/^﹣ /- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Truth gate
        run: npm run test:truth
      - name: Stress check (local mode)
        env:
          SANNR_STRESS_LOCAL: "1"
        run: npm run test:stress
      - name: Gate summary
        run: echo 'Passed unit tests, truth gate, and stress check (local mode; offline fixture only).' >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Pack and checksum
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [gates]
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify version equals tag
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*))?(?:\+[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*)?$/.exec(version);
          if (!match || match[4]?.split(".").some(part => /^0[0-9]+$/.test(part))
            || process.env.RELEASE_TAG !== `v${version}`) {
            console.error("Requested tag does not match package version");
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${Boolean(match[4])}\n`);
          NODE
      - name: Build the alpha installer ZIP (alpha.N tags only)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            npm run pack:alpha -- --out release-artifacts
          else
            echo "No alpha installer for this tag; beta and later releases install from npm."
          fi
      - name: Pack the package
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
      - name: Verify the packed entry allowlist
        run: node scripts/verify-package.mjs release-artifacts/*.tgz
      - name: Fresh install with optional protocol dependencies
        run: node scripts/verify-protocol-install.mjs release-artifacts/*.tgz release-artifacts/protocol-install.json
      - name: Compute SHA-256 checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          shopt -s nullglob
          assets=(*.tgz *.zip)
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.tgz
            release-artifacts/*.zip
      - name: Upload the package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sannr-package
          path: |
            release-artifacts/*.tgz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: Prepare draft GitHub Release
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download the package and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sannr-package
          path: release-artifacts
      - name: Verify downloaded checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Create the draft release and attach the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-artifacts/*.tgz release-artifacts/*.zip release-artifacts/SHA256SUMS)
          release_options=()
          case "$RELEASE_PRERELEASE" in
            true) release_options=(--prerelease --latest=false) ;;
            false) ;;
            *) echo "Release classification is missing" >&2; exit 1 ;;
          esac
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "sannr ${RELEASE_TAG}" \
            --generate-notes \
            "${release_options[@]}" "${assets[@]}"
