# This is the owner's launch-day act and is never triggered by a tag.
name: Publish package to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string
      approved_sha256:
        description: Owner-approved SHA-256 of the existing release tarball; publishing never repacks it
        required: true
        type: string
      approved_commit:
        description: Owner-approved full source commit; the version tag must still resolve to it
        required: true
        type: string
      promote_latest:
        description: Update the default npm install and package front page. Disable only when the owner explicitly requests a channel-only release (for example beta-only).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gates:
    name: Package gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Require public source for npm provenance
        env:
          SOURCE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$SOURCE_REPOSITORY_PRIVATE" != "false" ]; then
            echo "NPM_PROVENANCE_PRIVATE_SOURCE: npm provenance requires a public source repository. Repository visibility and provenance settings were not changed." >&2
            exit 1
          fi
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Require the approved source commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          if ! [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$APPROVED_COMMIT" ]; then
            echo "APPROVED_COMMIT_MISMATCH: tag must resolve to the owner-approved commit." >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify version equals tag
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*))?(?:\+[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*)?$/.exec(version);
          if (!match || match[4]?.split(".").some(part => /^0[0-9]+$/.test(part))
            || process.env.RELEASE_TAG !== `v${version}`) {
            console.error("Requested tag does not match package version");
            process.exit(1);
          }
          // The prerelease label names its channel: alpha.N -> alpha, beta.N -> beta,
          // anything else (rc.N and the like) -> next. Stable versions use latest.
          const label = match[4]?.split(".")[0];
          const channel = !label ? "latest" : ["alpha", "beta"].includes(label) ? label : "next";
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${channel}\n`);
          NODE
      - name: Unit tests (skips listed by name, never hidden)
        shell: bash
        run: |
          npm run test:full 2>&1 | tee unit.log
          {
            echo "### Unit tests — Node ${{ matrix.node }}"
            grep -E '^(ℹ|#) (tests|pass|fail|skipped)' unit.log | sed -E 's/^(ℹ|#) /- /'
            echo
            echo "Skipped on this runner (a skip is a claim this run did not check):"
            grep -E '^﹣|# SKIP' unit.log | sed -E 's/^﹣ /- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Truth gate
        run: npm run test:truth
      - name: Stress check (local mode)
        env:
          SANNR_STRESS_LOCAL: "1"
        run: npm run test:stress
      - name: Gate summary
        run: echo 'Passed unit tests, truth gate, and stress check (local mode; offline fixture only).' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified tarball
    needs: [gates]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require public source for npm provenance
        env:
          SOURCE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$SOURCE_REPOSITORY_PRIVATE" != "false" ]; then
            echo "NPM_PROVENANCE_PRIVATE_SOURCE: npm provenance requires a public source repository. Repository visibility and provenance settings were not changed." >&2
            exit 1
          fi
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Require the approved source commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          if ! [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$APPROVED_COMMIT" ]; then
            echo "APPROVED_COMMIT_MISMATCH: tag must resolve to the owner-approved commit." >&2
            exit 1
          fi
      - name: Set up Node and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify version equals tag
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*))?(?:\+[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*)?$/.exec(version);
          if (!match || match[4]?.split(".").some(part => /^0[0-9]+$/.test(part))
            || process.env.RELEASE_TAG !== `v${version}`) {
            console.error("Requested tag does not match package version");
            process.exit(1);
          }
          // The prerelease label names its channel: alpha.N -> alpha, beta.N -> beta,
          // anything else (rc.N and the like) -> next. Stable versions use latest.
          const label = match[4]?.split(".")[0];
          const channel = !label ? "latest" : ["alpha", "beta"].includes(label) ? label : "next";
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${channel}\n`);
          NODE
      - name: Download the existing owner-approved release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --pattern SHA256SUMS --dir release-artifacts
      - name: Verify the exact approved artifact and source bytes
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one approved release tarball" >&2
            exit 1
          fi
          node scripts/verify-release-artifact.mjs "${archives[0]}" "$APPROVED_SHA256" "$APPROVED_COMMIT" release-artifacts/SHA256SUMS > release-artifacts/VERIFIED.json
      - name: Cold install the exact artifact before publication
        run: node scripts/verify-npx-install.mjs release-artifacts/*.tgz release-artifacts/cold-install.json
      - name: Fresh install with optional protocol dependencies
        run: node scripts/verify-protocol-install.mjs release-artifacts/*.tgz release-artifacts/protocol-install.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.tgz
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG" release-artifacts/*.tgz
      - name: Promote the published version to latest (default release policy)
        if: ${{ inputs.promote_latest }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')" latest
      - name: Verify public npm tags
        shell: bash
        timeout-minutes: 8
        env:
          NPM_DIST_TAG: ${{ steps.metadata.outputs.dist_tag }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          verify_tags() {
            node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          let tags;
          try { tags = JSON.parse(readFileSync("release-artifacts/dist-tags.json", "utf8")); }
          catch { console.error("Registry tag readback was not valid JSON."); process.exit(1); }
          const expected = new Set([process.env.NPM_DIST_TAG]);
          if (process.env.PROMOTE_LATEST === "true") expected.add("latest");
          for (const tag of expected) {
            if (tags?.[tag] !== version) {
              console.error(`Registry tags not yet visible: ${name} ${tag} is ${tags?.[tag] ?? "missing"}; expected ${version}.`);
              process.exit(1);
            }
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Registry tags verified for ${name}@${version}: ${[...expected].join(", ")}.\n` +
            (expected.has("latest")
              ? "Release completion still requires the npm front page to visibly show this version, plus the public artifact/install checks in packaging/README.md.\n"
              : `Owner selected ${process.env.NPM_DIST_TAG}-only; the default install and front page were not promoted. Public artifact/install checks remain required.\n`));
          NODE
          }
          package_name=$(node -p 'require("./package.json").name')
          # Five reads span five minutes, plus bounded registry request time.
          # Only the readback repeats; never republish or mutate tags here.
          for attempt in 1 2 3 4 5; do
            if npm view "$package_name" dist-tags --json --prefer-online --fetch-retries=0 --fetch-timeout=30000 --registry=https://registry.npmjs.org/ > release-artifacts/dist-tags.json && verify_tags; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Registry readback $attempt/5 is pending; checking again in 75 seconds."
              sleep 75
            fi
          done
          echo "NPM_TAG_VERIFICATION_PENDING: required tags were not verified after five reads. Recheck the registry; do not republish the tarball." >&2
          exit 1
