# Routine CI runs core safety only; full qualification is an explicit manual
# dispatch or a release gate. No artifacts, release or publication here.
# Keep Package gates as the existing required check name on main.
# Windows runs bounded core/native lanes on every PR; the serial full product run
# on Windows is the manual windows_full dispatch input.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all product regressions, truth, and local stress instead of core safety
        type: boolean
        default: false
      windows_full:
        description: Also run every product regression on Windows (Node 22 and 24); slow, opt-in only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.lane }} (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        lane: [safety, native-workbench]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the selected Windows lane
        shell: pwsh
        env:
          WINDOWS_TEST_LANE: ${{ matrix.lane }}
        run: |
          if ($env:WINDOWS_TEST_LANE -eq 'safety') {
            npm test 2>&1 | Tee-Object -FilePath windows.log
          } else {
            node --test --test-timeout=60000 --test-reporter=tap test/native-platform.test.mjs test/alpha4-durable-mcp.test.mjs test/workbench-control.test.mjs test/workbench-agent.test.mjs test/workbench-engine.test.mjs test/workbench-server.test.mjs test/workbench-session.test.mjs 2>&1 | Tee-Object -FilePath windows.log
          }
          $testExit = $LASTEXITCODE
          "### Windows $env:WINDOWS_TEST_LANE — Node ${{ matrix.node }}" >> $env:GITHUB_STEP_SUMMARY
          "Scope: the named lane, not full product or release qualification." >> $env:GITHUB_STEP_SUMMARY
          Select-String -Path windows.log -Pattern '^# (tests|pass|fail|cancelled|skipped|todo) ', '^not ok ', '# SKIP' | ForEach-Object { $_.Line } >> $env:GITHUB_STEP_SUMMARY
          exit $testExit
  windows-full:
    name: Windows full product suite (Node ${{ matrix.node }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_full }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run every product regression on Windows
        shell: pwsh
        run: |
          npm run test:full 2>&1 | Tee-Object -FilePath windows-full.log
          $testExit = $LASTEXITCODE
          "### Windows full product suite — Node ${{ matrix.node }}" >> $env:GITHUB_STEP_SUMMARY
          "Scope: every product regression file on windows-latest; not truth, stress or release packaging." >> $env:GITHUB_STEP_SUMMARY
          Select-String -Path windows-full.log -Pattern '^# (tests|pass|fail|cancelled|skipped|todo) ', '^not ok ', '# SKIP' | ForEach-Object { $_.Line } >> $env:GITHUB_STEP_SUMMARY
          exit $testExit
  gates:
    name: Package gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency vulnerability report (non-blocking)
        continue-on-error: true
        run: npm audit
      - name: Core safety (not full qualification)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
        shell: bash
        run: |
          npm test 2>&1 | tee unit.log
          {
            echo "### Core safety only — Node ${{ matrix.node }}"
            grep -E '^(ℹ|#) (tests|pass|fail|skipped)' unit.log | sed -E 's/^(ℹ|#) /- /'
            echo
            echo "Skipped on this runner (a skip is a claim this run did not check):"
            grep -E '^﹣|# SKIP' unit.log | sed -E 's/^﹣ /- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Protocol adapter integrity
        # The core safety set never loads the optional adapters. A dependency
        # bump that skips scripts/pin-runtime-dependencies.mjs would pass it and
        # still refuse every gRPC or WebSocket call with PROTOCOL_PACKAGE_INTEGRITY.
        run: node --test test/protocol-grpc.test.mjs test/protocol-client.test.mjs test/protocol-declaration-dependencies.test.mjs test/alpha-protocol-boundaries.test.mjs
      - name: Product regression suite (explicit opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        shell: bash
        run: |
          npm run test:full 2>&1 | tee unit.log
          {
            echo "### Product regression suite — Node ${{ matrix.node }}"
            grep -E '^(ℹ|#) (tests|pass|fail|skipped)' unit.log | sed -E 's/^(ℹ|#) /- /'
            echo "Skipped on this runner (not checked):"
            grep -E '^﹣|# SKIP' unit.log | sed -E 's/^﹣ /- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Truth gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: npm run test:truth
      - name: Stress check (local mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        env:
          SANNR_STRESS_LOCAL: "1"
        run: npm run test:stress
      - name: Gate summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: echo 'Passed unit tests, truth gate, and stress check (local mode; offline fixture only).' >> "$GITHUB_STEP_SUMMARY"
